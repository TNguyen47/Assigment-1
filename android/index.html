<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo nút xin chào</title>
  <style>
    body { font-family: system-ui, sans-serif; display:flex; min-height:100vh; margin:0; }
    .wrap { margin:auto; text-align:center; }
    button { padding:10px 16px; font-size:16px; cursor:pointer; }
    #msg { margin-top:12px; font-size:18px; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; margin: auto;">
    <div>
      <button id="helloBtn">Click Me</button>
      <div id="msg"></div>
    </div>

    <div>
      <button id="byeBtn">To be continue...</button>
      <div id="msg"></div>
    </div>

  </div>
  

  <script>
    const btn1 = document.getElementById('helloBtn');
    const btn2 = document.getElementById('byeBtn');
    const msg = document.getElementById('msg');

    btn1.addEventListener('click', () => {
      msg.textContent = 'xin chào';
    });

    btn2.addEventListener('click', () => {
      msg.textContent = 'tạm biệt';
    });

  </script>
</body>
</html>
